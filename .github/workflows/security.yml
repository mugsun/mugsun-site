name: Security scan

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    - cron: "23 1 * * *" # 每日 09:23（Asia/Shanghai）
  workflow_dispatch:

permissions:
  contents: read

# 定时扫描单独一组且不取消：push/PR 的新运行不会把每日扫描取消，
# 也就不会因 cancelled() 误触发 notify 开 issue。其他事件按分支取消旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, sha256 verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks

      - name: Scan
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  notify:
    name: Report scheduled failure
    needs: [gitleaks]
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update issue
        run: |
          title="每日安全扫描失败"
          label="security-scan"
          gh label create "$label" --color B60205 --description "每日安全扫描失败告警" --force
          num=$(gh issue list --state open --label "$label" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="每日安全扫描失败或被取消，请开源维护官查看：$RUN_URL"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
